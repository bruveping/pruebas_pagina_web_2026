<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor y Creador de PDFs de Acordes</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0284c7',
              700: '#0369a1',
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Target Sheet simulation on screen */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      margin: 0 auto;
      transition: all 0.2s ease-in-out;
    }

    /* SVG container responsive scaling */
    .svg-wrapper svg {
      width: 100% !important;
      height: auto !important;
      display: block;
    }

    /* Print Specific Formatting */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: white !important;
        color: black !important;
        padding: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .a4-page {
        width: 100% !important;
        min-height: auto !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
        border: none !important;
        background: white !important;
      }
      .chord-card {
        break-inside: avoid;
        page-break-inside: avoid;
        box-shadow: none !important;
        border: 1px solid #e2e8f0 !important;
        background: white !important;
      }
      .editable-input {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        text-align: center !important;
        font-weight: bold !important;
        color: black !important;
      }
      .card-actions {
        display: none !important;
      }
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-200">

  <!-- TOP BAR / HEADER (NO PRINT) -->
  <header class="no-print bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
      
      <!-- Logo & Title -->
      <div class="flex items-center gap-3">
        <div class="p-2 bg-red-500/10 dark:bg-red-500/20 text-red-600 dark:text-red-400 rounded-xl">
          <i class="fa-solid fa-guitar text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 dark:text-white leading-tight">Gestor de Acordes SVG</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">Organiza tus diagramas en columnas y exporta a PDF</p>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Theme Toggle -->
        <button id="theme-toggle" class="p-2 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition" title="Cambiar Tema">
          <i class="fa-solid fa-moon dark:hidden text-lg"></i>
          <i class="fa-solid fa-sun hidden dark:block text-lg"></i>
        </button>

        <!-- Clear All -->
        <button id="clear-all-btn" class="px-3 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:text-red-600 hover:bg-red-50 dark:hover:bg-red-950/30 rounded-xl transition border border-slate-200 dark:border-slate-700 flex items-center gap-1.5">
          <i class="fa-solid fa-trash-can"></i> Limpiar Todo
        </button>

        <!-- Export PDF / Print -->
        <button onclick="window.print()" class="px-5 py-2.5 text-xs font-bold text-white bg-red-600 hover:bg-red-700 active:bg-red-800 rounded-xl shadow-lg shadow-red-500/20 transition flex items-center gap-2">
          <i class="fa-solid fa-file-pdf text-base"></i> Exportar PDF / Imprimir
        </button>
      </div>
    </div>
  </header>

  <!-- TOOLBAR CONTROL PANEL (NO PRINT) -->
  <section class="no-print bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 py-3 px-4 sm:px-6 z-20">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4 text-xs font-medium">
      
      <!-- Upload File Input Zone -->
      <div class="flex items-center gap-2">
        <label for="svg-file-input" class="cursor-pointer px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-xs transition flex items-center gap-2 font-semibold">
          <i class="fa-solid fa-cloud-arrow-up text-sm"></i> Subir Archivos SVG
        </label>
        <input type="file" id="svg-file-input" accept=".svg" multiple class="hidden" />
        <span id="file-count-badge" class="text-slate-500 dark:text-slate-400 text-xs">9 SVG cargados</span>
      </div>

      <!-- Column Selector Controls (1 - 5) -->
      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
        <span class="text-slate-500 dark:text-slate-400 px-2 flex items-center gap-1"><i class="fa-solid fa-table-columns"></i> Columnas:</span>
        <div class="flex gap-1" id="col-buttons">
          <button data-cols="1" class="col-btn px-2.5 py-1 rounded-lg transition hover:bg-white dark:hover:bg-slate-800">1</button>
          <button data-cols="2" class="col-btn px-2.5 py-1 rounded-lg transition hover:bg-white dark:hover:bg-slate-800">2</button>
          <button data-cols="3" class="col-btn px-2.5 py-1 rounded-lg transition bg-white dark:bg-slate-800 shadow-xs font-bold text-brand-600 dark:text-brand-400">3</button>
          <button data-cols="4" class="col-btn px-2.5 py-1 rounded-lg transition hover:bg-white dark:hover:bg-slate-800">4</button>
          <button data-cols="5" class="col-btn px-2.5 py-1 rounded-lg transition hover:bg-white dark:hover:bg-slate-800">5</button>
        </div>
      </div>

      <!-- Zoom Controls (+ / - / Reset) -->
      <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
        <span class="text-slate-500 dark:text-slate-400 px-2 flex items-center gap-1"><i class="fa-solid fa-magnifying-glass"></i> Zoom:</span>
        <button id="zoom-out-btn" class="p-1.5 px-2 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition text-slate-700 dark:text-slate-200" title="Alejar">
          <i class="fa-solid fa-minus"></i>
        </button>
        <span id="zoom-value" class="w-12 text-center font-bold text-slate-700 dark:text-slate-200">100%</span>
        <button id="zoom-in-btn" class="p-1.5 px-2 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition text-slate-700 dark:text-slate-200" title="Acercar">
          <i class="fa-solid fa-plus"></i>
        </button>
        <button id="zoom-reset-btn" class="px-2 py-1 hover:bg-white dark:hover:bg-slate-800 rounded-lg transition text-slate-500 text-[10px] uppercase font-bold" title="Restablecer Zoom">
          Reset
        </button>
      </div>

    </div>
  </section>

  <!-- MAIN SHEET WORKSPACE -->
  <main class="flex-1 p-4 sm:p-8 overflow-auto flex justify-center">
    
    <!-- Drag & Drop Overlay Zone -->
    <div id="drop-zone" class="a4-page bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/60 shadow-xl rounded-2xl relative transition-all duration-200">
      
      <!-- Editable Sheet Header -->
      <div class="mb-6 border-b border-slate-200 dark:border-slate-700 pb-4">
        <input 
          type="text" 
          value="Diagramas de Acordes de Guitarra" 
          class="editable-input w-full text-2xl font-bold text-slate-900 dark:text-white text-center border border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-brand-500 focus:outline-none rounded-lg p-1 transition"
          placeholder="Título de la Hoja"
        />
        <input 
          type="text" 
          value="Cuadrícula en columnas para estudio e impresión" 
          class="editable-input w-full text-xs text-slate-500 dark:text-slate-400 text-center mt-1 border border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-brand-500 focus:outline-none rounded-lg p-1 transition"
          placeholder="Subtítulo opcional"
        />
      </div>

      <!-- Empty State Indicator -->
      <div id="empty-state" class="hidden py-20 text-center flex-col items-center justify-center">
        <div class="p-4 bg-slate-100 dark:bg-slate-700/50 text-slate-400 rounded-full mb-4">
          <i class="fa-solid fa-file-circle-plus text-4xl"></i>
        </div>
        <h3 class="text-base font-semibold text-slate-700 dark:text-slate-200 mb-1">No hay diagramas cargados</h3>
        <p class="text-xs text-slate-500 max-w-sm">Arrastra tus archivos SVG directamente aquí o utiliza el botón superior para cargar desde tu equipo.</p>
      </div>

      <!-- Chord Diagrams Grid -->
      <div id="chord-grid" class="grid grid-cols-3 gap-4 transition-all duration-300">
        <!-- SVG Cards will be appended here -->
      </div>

      <!-- Page Footer -->
      <div class="mt-12 pt-4 border-t border-slate-200 dark:border-slate-700 flex justify-between items-center text-[10px] text-slate-400">
        <span>Hoja de Trabajo de Acordes</span>
        <span id="card-count-footer">9 Acordes</span>
      </div>

    </div>

  </main>

      { name: "09_Em7_D.svg", svg: `<svg viewBox="0 0 240 120" xmlns="http://www.w3.org/2000/svg"><rect width="240" height="120" fill="#f8fafc" rx="6"/><line x1="30" y1="30" x2="210" y2="30" stroke="#090d16" stroke-width="4"/><line x1="30" y1="90" x2="210" y2="90" stroke="#090d16" stroke-width="4"/><line x1="36" y1="30" x2="36" y2="90" stroke="#090d16" stroke-width="4"/><line x1="71" y1="30" x2="71" y2="90" stroke="#090d16" stroke-width="3.5"/><line x1="106" y1="30" x2="106" y2="90" stroke="#090d16" stroke-width="3"/><line x1="141" y1="30" x2="141" y2="90" stroke="#090d16" stroke-width="2.5"/><line x1="176" y1="30" x2="176" y2="90" stroke="#090d16" stroke-width="2"/><line x1="202" y1="30" x2="202" y2="90" stroke="#090d16" stroke-width="1.5"/><circle cx="95" cy="60" r="5" fill="#cbd5e1"/><circle cx="155" cy="60" r="5" fill="#cbd5e1"/><circle cx="106" cy="60" r="13" fill="#0f172a"/><circle cx="141" cy="60" r="13" fill="#0f172a"/><circle cx="176" cy="60" r="13" fill="#0f172a"/><circle cx="202" cy="60" r="13" fill="#e11d48"/></svg>` }
    ];

    // Format Title from filename (e.g., "01_Dm7_C.svg" -> "01. Dm7 / C")
    function cleanFilename(filename) {
      let name = filename.replace(/\.svg$/i, '');
      name = name.replace(/_/g, ' ');
      return name;
    }

    // Initialize Default Data
    function initDefaults() {
      chordItems = defaultSVGs.map((item, idx) => ({
        id: 'chord-' + Date.now() + '-' + idx,
        title: cleanFilename(item.name),
        svgContent: item.svg
      }));
      renderGrid();
    }

    // Render Grid Cards
    function renderGrid() {
      if (chordItems.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        chordGrid.innerHTML = '';
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');

        chordGrid.innerHTML = chordItems.map((item, index) => `
          <div class="chord-card bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl p-3 flex flex-col justify-between group relative shadow-xs hover:shadow-md transition">
            
            <!-- Quick Actions (Delete) -->
            <button 
              onclick="removeChord('${item.id}')" 
              class="card-actions absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1.5 bg-red-500 text-white rounded-lg text-xs transition shadow-md hover:bg-red-600 z-10"
              title="Eliminar Acorde"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>

            <!-- SVG Wrapper with Zoom Applied -->
            <div class="svg-wrapper w-full flex items-center justify-center p-1" style="transform: scale(${currentZoom / 100}); transform-origin: center center;">
              ${item.svgContent}
            </div>

            <!-- Editable Title -->
            <input 
              type="text" 
              value="${item.title}" 
              onchange="updateTitle('${item.id}', this.value)"
              class="editable-input w-full text-center text-xs font-bold text-slate-800 dark:text-slate-100 bg-transparent border border-transparent hover:border-slate-300 dark:hover:border-slate-600 focus:border-brand-500 focus:outline-none rounded py-1 mt-2 transition"
              placeholder="Nombre del Acorde"
            />
          </div>
        `).join('');
      }

      // Update counters
      fileCountBadge.textContent = `${chordItems.length} SVG cargados`;
      cardCountFooter.textContent = `${chordItems.length} Acordes`;
    }

    // Remove single chord
    window.removeChord = function(id) {
      chordItems = chordItems.filter(item => item.id !== id);
      renderGrid();
    };

    // Update chord title
    window.updateTitle = function(id, newTitle) {
      const item = chordItems.find(i => i.id === id);
      if (item) item.title = newTitle;
    };

    // Column Layout Switcher (1 to 5)
    function setColumns(cols) {
      currentCols = cols;
      chordGrid.className = `grid grid-cols-${cols} gap-4 transition-all duration-300`;
      
      // Update Button Styles
      document.querySelectorAll('.col-btn').forEach(btn => {
        if (parseInt(btn.getAttribute('data-cols')) === cols) {
          btn.className = "col-btn px-2.5 py-1 rounded-lg transition bg-white dark:bg-slate-800 shadow-xs font-bold text-brand-600 dark:text-brand-400";
        } else {
          btn.className = "col-btn px-2.5 py-1 rounded-lg transition hover:bg-white dark:hover:bg-slate-800 text-slate-600 dark:text-slate-400";
        }
      });
    }

    document.getElementById('col-buttons').addEventListener('click', (e) => {
      const btn = e.target.closest('.col-btn');
      if (btn) {
        const cols = parseInt(btn.getAttribute('data-cols'));
        setColumns(cols);
      }
    });

    // Zoom Controls
    function updateZoom(newZoom) {
      currentZoom = Math.min(Math.max(newZoom, 50), 200);
      zoomValue.textContent = `${currentZoom}%`;
      renderGrid();
    }

    document.getElementById('zoom-in-btn').addEventListener('click', () => updateZoom(currentZoom + 10));
    document.getElementById('zoom-out-btn').addEventListener('click', () => updateZoom(currentZoom - 10));
    document.getElementById('zoom-reset-btn').addEventListener('click', () => updateZoom(100));

    // Read and Process File Uploads
    function handleFiles(files) {
      const svgFiles = Array.from(files).filter(f => f.type === 'image/svg+xml' || f.name.endsWith('.svg'));
      if (svgFiles.length === 0) return;

      let pending = svgFiles.length;

      svgFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          chordItems.push({
            id: 'chord-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
            title: cleanFilename(file.name),
            svgContent: e.target.result
          });
          pending--;
          if (pending === 0) renderGrid();
        };
        reader.readAsText(file);
      });
    }

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // Drag and Drop support
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-brand-500', 'ring-2', 'ring-brand-500/20');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-brand-500', 'ring-2', 'ring-brand-500/20');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-brand-500', 'ring-2', 'ring-brand-500/20');
      if (e.dataTransfer.files) handleFiles(e.dataTransfer.files);
    });

    // Clear All
    document.getElementById('clear-all-btn').addEventListener('click', () => {
      if (confirm('¿Estás seguro de que deseas eliminar todos los acordes?')) {
        chordItems = [];
        renderGrid();
      }
    });

    // Dark/Light Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
    });

    // Initialize Page
    initDefaults();
  </script>
</body>
</html>
